spring.application.name=kosmo_react

# Datasource Configuration (Supabase PostgreSQL Connection Pool / Transaction Mode)
spring.datasource.driver-class-name=org.postgresql.Driver
# 중요: Supabase 풀러를 사용하여 외부에서 접속할 때 포트번호는 일반적으로 5432 또는 6543을 쓰지만, 연결 문자열 옵션을 명시해 주는 것이 안전합니다.
spring.datasource.url=jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.username=postgres.zvbgzlbhwjxrtmqdvrjw
spring.datasource.password=UQBv8xlW0QMdnxeN

# JPA / Hibernate Configuration
# 주의: 운영(Production) 단계에서는 절대로 'create'나 'update'를 사용하면 안 됩니다. (개발용으로만 사용)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
# 최신 스프링 부트 환경을 위한 SQL 방언 자동 지정 옵션 (선택 사항)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT (Json Web Token) Configuration
jwt.access-valid-time=60000
jwt.refresh-valid-time=600000
jwt.issuer=winter
jwt.secret-key=adfua342fsfaaa0fdsa23423423sdsfdfwinterprojectsecretkeyvalue2026

# File Upload Configuration
app.upload.base-dir=${APP_UPLOAD_DIR:D:/upload}
app.upload.sub-dirs.members=members
app.upload.sub-dirs.notices=notices
app.upload.sub-dirs.qna=qna

# Multipart Upload Limits (오타 수정: multipart가 정상 작동하도록 부트 표준 프로퍼티로 변경)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Stock API Configuration
app.stock.api-url=${STOCK_API_URL:https://openapi.koreainvestment.com:5700}
app.stock.api-key=${STOCK_API_KEY:none}
app.stock.api-secret=${STOCK_API_SECRET:none}